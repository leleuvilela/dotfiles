onboarding = false

[keys]
prefix = "ctrl+s"

navigate_workspace_up = "k"
navigate_workspace_down = "j"

[[keys.command]]
key = "prefix+f"
type = "popup"
command = "~/dotfiles/scripts/sessionizer"
description = "sessionizer: pick a project workspace"
width = "80%"
height = "80%"

[ui.toast]
delivery = "system"

[theme]
name = "gruvbox"
auto_switch = false
