unbind r
bind r source-file ~/.tmux.conf

set -g mouse on    # Enable mouse in tmux
set -g base-index 1
set -g pane-base-index 1
set -g set-clipboard on
set -g status-position top

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-sensible'



# set prefix
unbind C-b
set -g prefix C-s
bind C-s send-prefix

set-option -g mouse on

# fix colors
set -sa terminal-overrides ",xterm*:Tc"

# yazi image preview
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Set 'v' for vertical and 'b' for horizontal split
bind v split-window -h -c '#{pane_current_path}'
bind b split-window -v -c '#{pane_current_path}'

#vim key maps
setw -g mode-keys vi

# Smart pane switching with awareness of vim and fzf
forward_programs="view|n?vim?|fzf"

should_forward="ps -o state= -o comm= -t '#{pane_tty}' \
| grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?($forward_programs)(diff)?$'"

bind -n C-h if-shell "$should_forward" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$should_forward" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$should_forward" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$should_forward" "send-keys C-l" "select-pane -R"
bind -n C-\\ if-shell "$should_forward" "send-keys C-\\" "select-pane -l"

# vim-like pane switching
bind -r k select-pane -U 
bind -r j select-pane -D 
bind -r h select-pane -L
bind -r l select-pane -R 

# vim-like pane resizing  
bind -r C-k resize-pane -U 4
bind -r C-j resize-pane -D 4
bind -r C-h resize-pane -L 4
bind -r C-o resize-pane -R 4

# vim-like window switching
bind -n M-H previous-window 
bind -n M-L next-window 

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"

bind-key -r H run-shell "~/.local/bin/tmux-sessionizer ~/.config"

# remove default binding since replacing
unbind %
unbind Up
unbind Down
unbind Left
unbind Right

unbind C-Up
unbind C-Down
unbind C-Left
unbind C-Right


# Undercurl
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0

# Toggle tmux status bar
bind '\' set status
if-shell "[[ $(tmux lsw | wc -l) -le 1 ]]" 'set -g status'

set -g status on

# Gruvbox dark
set -g status-style "bg=#282828,fg=#ebdbb2"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#b8bb26,fg=#282828,bold] #S #[default] "
set -g status-right "#[fg=#83a598]#{b:pane_current_path} #[fg=#fabd2f]%H:%M "
setw -g window-status-style "bg=#282828,fg=#a89984"
setw -g window-status-current-style "bg=#504945,fg=#fabd2f,bold"
setw -g window-status-format " #I #W "
setw -g window-status-current-format " #I #W#{?window_zoomed_flag,(),} "
set -g pane-border-style "fg=#504945"
set -g pane-active-border-style "fg=#b8bb26"
set -g message-style "bg=#3c3836,fg=#ebdbb2"
set -g message-command-style "bg=#3c3836,fg=#fabd2f"
setw -g mode-style "bg=#504945,fg=#ebdbb2"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
